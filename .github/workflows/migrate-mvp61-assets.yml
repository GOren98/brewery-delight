name: migrate-mvp61-static-assets

on:
  push:
    branches:
      - mvp6-1-crops-cooking-pot
    paths:
      - '.github/workflows/migrate-mvp61-assets.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp6-1-crops-cooking-pot
          fetch-depth: 0

      - name: Expand MVP 6.1 resources once
        shell: bash
        run: |
          set -euo pipefail

          cat src/mvp61Assets/crop_atlas.b64.part* | tr -d '\n\r ' | base64 -d > /tmp/crop_atlas.png
          cat src/mvp61Assets/item_atlas.b64.part* | tr -d '\n\r ' | base64 -d > /tmp/item_atlas.png
          cat src/mvp61Assets/crop_patch.b64.part* | tr -d '\n\r ' | base64 -d > /tmp/crop_patch.png
          cat src/mvp61Assets/item_patch.b64.part* | tr -d '\n\r ' | base64 -d > /tmp/item_patch.png

          if command -v magick >/dev/null 2>&1; then
            IMG=magick
          elif command -v convert >/dev/null 2>&1; then
            IMG=convert
          else
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
            IMG=convert
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, os

          root = Path('src/main/resources/assets/brewerydelight')
          blockstates = root / 'blockstates'
          block_models = root / 'models/block'
          item_models = root / 'models/item'
          block_tex = root / 'textures/block'
          item_tex = root / 'textures/item'
          for p in (blockstates, block_models, item_models, block_tex, item_tex):
              p.mkdir(parents=True, exist_ok=True)

          ids = [
              'red_grape','white_grape','berry','apple','pear','peach','orange','lemon','mango','kiwi','pineapple',
              'cherry','plum','apricot','lime','banana','rice','barley','corn','sweet_potato','hops','tea','rye',
              'agave','juniper','millet','anise','almond','walnut','coffee','vanilla','cinnamon','ginger','nutmeg'
          ]
          patches = ['rye','agave','juniper','millet','anise']
          img = os.environ.get('IMG_CMD') or ('magick' if subprocess.run(['bash','-lc','command -v magick'], capture_output=True).returncode == 0 else 'convert')

          def crop(source, x, y, target):
              subprocess.run([img, source, '-crop', f'16x16+{x}+{y}', '+repage', str(target)], check=True)

          for index, crop_id in enumerate(ids):
              patched = crop_id in patches
              local = patches.index(crop_id) if patched else index
              crop_source = '/tmp/crop_patch.png' if patched else '/tmp/crop_atlas.png'
              item_source = '/tmp/item_patch.png' if patched else '/tmp/item_atlas.png'
              crop_cols = 8 if patched else 16
              item_cols = 10 if patched else 16

              variants = {}
              for age in range(4):
                  cell = local * 4 + age
                  x = (cell % crop_cols) * 16
                  y = (cell // crop_cols) * 16
                  model = f'{crop_id}_crop_stage{age}'
                  crop(crop_source, x, y, block_tex / f'{model}.png')
                  (block_models / f'{model}.json').write_text(json.dumps({
                      'parent': 'minecraft:block/crop',
                      'render_type': 'minecraft:cutout',
                      'textures': {'crop': f'brewerydelight:block/{model}'}
                  }, indent=2) + '\n', encoding='utf-8')
                  variants[f'age={age}'] = {'model': f'brewerydelight:block/{model}'}

              (blockstates / f'{crop_id}_crop.json').write_text(
                  json.dumps({'variants': variants}, indent=2) + '\n', encoding='utf-8')

              for offset, suffix in enumerate(('', '_seeds')):
                  cell = local * 2 + offset
                  x = (cell % item_cols) * 16
                  y = (cell // item_cols) * 16
                  item_name = crop_id + suffix
                  crop(item_source, x, y, item_tex / f'{item_name}.png')
                  (item_models / f'{item_name}.json').write_text(json.dumps({
                      'parent': 'minecraft:item/generated',
                      'textures': {'layer0': f'brewerydelight:item/{item_name}'}
                  }, indent=2) + '\n', encoding='utf-8')
          PY

          rm -rf src/mvp61Assets
          rm -f src/main/resources/assets/brewerydelight/textures/block/crop_atlas.png
          rm -f src/main/resources/assets/brewerydelight/textures/block/crop_patch_atlas.png
          rm -f src/main/resources/assets/brewerydelight/textures/item/item_atlas.png
          rm -f src/main/resources/assets/brewerydelight/textures/item/item_patch_atlas.png
          rm -f .github/workflows/migrate-mvp61-assets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MVP 6.1: store crop resources as static Minecraft assets'
          git push origin HEAD:mvp6-1-crops-cooking-pot
