plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        brewerydelight { sourceSet sourceSets.main }
    }
}

dependencies {
    // Farmer's Delight is a required runtime dependency. The MVP integrates through its public recipe JSON format,
    // so compiling against FD classes is intentionally avoided.
}

tasks.withType(ProcessResources).configureEach {
    def props = [minecraft_version: minecraft_version, neo_version: neo_version,
                 mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
