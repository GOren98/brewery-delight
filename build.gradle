plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        brewerydelight { sourceSet sourceSets.main }
    }
}

dependencies {
    // MVP 6.1 removes Farmer's Delight and Pam's HarvestCraft as runtime dependencies.
    // Their selected assets/behaviours are internalized in Brewery Delight.

    // JEI remains optional at runtime.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:19.21.0.247"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:19.21.0.247"
}

tasks.withType(ProcessResources).configureEach {
    def props = [minecraft_version: minecraft_version, neo_version: neo_version,
                 mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
